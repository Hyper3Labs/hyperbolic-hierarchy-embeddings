[project]
name = "hypembed"
version = "0.1.0"
description = "Lorentz vs Euclidean shallow graph embeddings on WordNet, the Google Product Taxonomy, and any edge list"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["torch>=2.1", "numpy>=1.24"]

[project.optional-dependencies]
wordnet = ["nltk>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypembed"]
